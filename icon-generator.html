<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Filament Store Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .icon-container { display: inline-block; margin: 10px; text-align: center; }
        canvas { border: 1px solid #ddd; background: white; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .sizes { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🧵 Filament Store - Icon Generator</h1>
    <p>Klicke auf die Buttons um die Icons als PNG herunterzuladen.</p>
    
    <div class="sizes">
        <button onclick="downloadIcon(72)">72x72 (favicon)</button>
        <button onclick="downloadIcon(96)">96x96</button>
        <button onclick="downloadIcon(128)">128x128</button>
        <button onclick="downloadIcon(144)">144x144 (iOS)</button>
        <button onclick="downloadIcon(152)">152x152 (iOS)</button>
        <button onclick="downloadIcon(192)">192x192 (Android)</button>
        <button onclick="downloadIcon(384)">384x384</button>
        <button onclick="downloadIcon(512)">512x512 (Splash)</button>
        <button onclick="downloadAll()">⬇️ Alle herunterladen</button>
    </div>
    
    <div id="preview"></div>

    <script>
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#1d4ed8');
            
            // Rounded rectangle background
            const radius = size * 0.15;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            // Spool icon
            ctx.fillStyle = 'white';
            const centerX = size / 2;
            const centerY = size / 2;
            const spoolWidth = size * 0.5;
            const spoolHeight = size * 0.6;
            
            // Spool body
            ctx.beginPath();
            ctx.roundRect(centerX - spoolWidth/2, centerY - spoolHeight/2, spoolWidth, spoolHeight, size * 0.05);
            ctx.fill();
            
            // Thread lines on spool
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = Math.max(1, size * 0.015);
            const lineCount = 4;
            const lineSpacing = spoolWidth / (lineCount + 1);
            
            for (let i = 1; i <= lineCount; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX - spoolWidth/2 + i * lineSpacing, centerY - spoolHeight/2 + size * 0.08);
                ctx.lineTo(centerX - spoolWidth/2 + i * lineSpacing, centerY + spoolHeight/2 - size * 0.08);
                ctx.stroke();
            }
            
            // Center hole
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(centerX, centerY, size * 0.08, 0, Math.PI * 2);
            ctx.fill();
            
            // Thread end (hanging down)
            ctx.strokeStyle = 'white';
            ctx.lineWidth = Math.max(2, size * 0.025);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX + size * 0.1, centerY + spoolHeight/2);
            ctx.quadraticCurveTo(
                centerX + size * 0.15, centerY + spoolHeight/2 + size * 0.1,
                centerX + size * 0.1, centerY + spoolHeight/2 + size * 0.15
            );
            ctx.stroke();
            
            return canvas;
        }
        
        function downloadIcon(size) {
            const canvas = generateIcon(size);
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAll() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            let delay = 0;
            sizes.forEach(size => {
                setTimeout(() => downloadIcon(size), delay);
                delay += 200;
            });
        }
        
        // Show previews
        function showPreviews() {
            const previewSizes = [72, 192, 512];
            const container = document.getElementById('preview');
            container.innerHTML = '<h2>Vorschau:</h2>';
            
            previewSizes.forEach(size => {
                const div = document.createElement('div');
                div.className = 'icon-container';
                
                const canvas = generateIcon(size);
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
                canvas.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
                
                const label = document.createElement('p');
                label.textContent = `${size}x${size}`;
                
                div.appendChild(canvas);
                div.appendChild(label);
                container.appendChild(div);
            });
        }
        
        showPreviews();
    </script>
</body>
</html>
