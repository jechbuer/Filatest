<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Spool -->
  <ellipse cx="256" cy="140" rx="120" ry="40" fill="#1e3a5f"/>
  <rect x="136" y="140" width="240" height="200" fill="#2563eb"/>
  <ellipse cx="256" cy="340" rx="120" ry="40" fill="#1d4ed8"/>
  
  <!-- Filament -->
  <ellipse cx="256" cy="140" rx="100" ry="30" fill="#60a5fa"/>
  <rect x="156" y="140" width="200" height="180" fill="#3b82f6"/>
  <ellipse cx="256" cy="320" rx="100" ry="30" fill="#2563eb"/>
  
  <!-- Center hole -->
  <ellipse cx="256" cy="140" rx="30" ry="10" fill="#1e3a5f"/>
  <rect x="226" y="140" width="60" height="180" fill="#1e3a5f"/>
  <ellipse cx="256" cy="320" rx="30" ry="10" fill="#0f172a"/>
  
  <!-- QR Code pattern (simplified) -->
  <g fill="white" opacity="0.9">
    <rect x="340" y="280" width="60" height="60" rx="4"/>
    <rect x="350" y="290" width="40" height="40" rx="2" fill="#3b82f6"/>
    <rect x="360" y="300" width="20" height="20" rx="1" fill="white"/>
  </g>
</svg>
